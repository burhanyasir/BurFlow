version: "3.9"

services:
  BurFlow:
    build: .
    container_name: BurFlow-ai
    ports:
      - "3456:3456"
    environment:
      - NODE_ENV=production
      - PORT=3456
      - LOG_LEVEL=info
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3456/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
