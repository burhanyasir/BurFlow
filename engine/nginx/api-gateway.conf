# ─── Production API Gateway ──────────────────────────────────────
# Place in /etc/nginx/sites-available/ or include from main config.

upstream saas-api {
    server saas-api:3000;
    keepalive 64;
}

upstream pipeline {
    server pipeline-orchestrator:3456;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.yourdomain.com;

    # Redirect to HTTPS in production
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.yourdomain.com;

    ssl_certificate /etc/ssl/certs/fullchain.pem;
    ssl_certificate_key /etc/ssl/private/privkey.pem;
    ssl_dhparam /etc/ssl/certs/dhparam.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Content-Security-Policy: restrict to API-only responses
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; frame-ancestors 'none'" always;

    gzip on;
    gzip_types application/json application/javascript text/plain text/css text/xml;
    gzip_min_length 256;
    gzip_comp_level 6;
    gzip_vary on;
    gzip_proxied any;

    client_max_body_size 50m;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;

    location /api/widget/ {
        proxy_pass http://saas-api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        expires -1;
    }

    location /api/ {
        proxy_pass http://saas-api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_pass_header Authorization;
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    location /health {
        proxy_pass http://saas-api/api/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /metrics {
        proxy_pass http://saas-api/api/metrics;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /pipeline/ {
        proxy_pass http://pipeline/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        internal;
    }

    access_log /var/log/nginx/api-access.log;
    error_log /var/log/nginx/api-error.log warn;
}
