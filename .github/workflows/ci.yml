name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, Typecheck & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: engine/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck across monorepo
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Run full test suite
        run: npm test

  docker:
    name: Docker Build Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: engine/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate docker-compose configuration
        run: docker compose config --quiet
        env:
          JWT_SECRET: ci-validation-only
          WIDGET_SECRET: ci-validation-only
          LLM_API_KEY: ci-validation-only
          INTERNAL_SYNC_KEY: ci-validation-only
          OPENAI_API_KEY: ci-validation-only

      - name: Build saas-api production image (multi-stage)
        run: docker build -f Dockerfile --target runner -t conversation-engine/saas-api:ci .

      - name: Build pipeline-orchestrator image (multi-stage)
        run: docker build -f Dockerfile --target pipeline-runner -t conversation-engine/pipeline:ci .
