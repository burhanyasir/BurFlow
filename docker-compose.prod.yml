# ─── Production deployment ────────────────────────────────────────
#   docker compose -f docker-compose.prod.yml --env-file .env up -d --build
#
# Deployment sequence (P0-4):
#   1. build the runner image
#   2. run the one-shot `migrate` service: npm run db:migrate
#      (+ npm run db:migrate:status) — migrations are an EXPLICIT step,
#      the app never auto-migrates on boot
#   3. start the `app` service only after the migration job succeeded
#   4. healthcheck gate via the container HEALTHCHECK + nginx depends_on
#
# Services:
#   migrate → one-shot migration job (runner image)
#   app     → saas-api server + background pipeline worker (runner image)
#   nginx   → SSL reverse proxy, rate limiting, static file server
#
# Database:
#   DATABASE_URL  → PostgreSQL/Neon (required in production; the app fails
#                   clearly and never silently falls back to SQLite)
#   data volume   → knowledge-pipeline SQLite stores + other runtime data
#
# Volume:
#   sqlite_data → persistent runtime data at /app/data (knowledge stores)

services:
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: burflow-migrate
    restart: "no"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL (Neon PostgreSQL) is required}
    command: ["sh", "-c", "npm run db:migrate && npm run db:migrate:status"]
    networks:
      - burflow-net

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: burflow-app
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL (Neon PostgreSQL) is required}
      - KNOWLEDGE_DB_PATH=/app/data/knowledge-saas.db
      - DATA_DIR=/app/data
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - WIDGET_SECRET=${WIDGET_SECRET:?WIDGET_SECRET is required}
      - INTERNAL_SYNC_KEY=${INTERNAL_SYNC_KEY:?INTERNAL_SYNC_KEY is required}
      - CORS_ORIGIN=${CORS_ORIGIN:?CORS_ORIGIN is required}
      - APP_URL=${APP_URL:?APP_URL is required}
      - PIPELINE_URL=${PIPELINE_URL:-http://127.0.0.1:3456}
      - OPENAI_API_KEY=${OPENAI_API_KEY:?OPENAI_API_KEY is required}
      - LLM_API_KEY=${LLM_API_KEY:?LLM_API_KEY is required}
      - EMBEDDING_DIMENSION=${EMBEDDING_DIMENSION:-1536}
      - SENDGRID_API_KEY=${SENDGRID_API_KEY:?SENDGRID_API_KEY is required}
      - SENDGRID_FROM_EMAIL=${SENDGRID_FROM_EMAIL:-noreply@yourdomain.com}
      - PADDLE_API_KEY=${PADDLE_API_KEY:?PADDLE_API_KEY is required}
      - PADDLE_WEBHOOK_SECRET=${PADDLE_WEBHOOK_SECRET:?PADDLE_WEBHOOK_SECRET is required}
      - PADDLE_ENVIRONMENT=${PADDLE_ENVIRONMENT:-sandbox}
      - PADDLE_PRODUCT_STARTER=${PADDLE_PRODUCT_STARTER:-}
      - PADDLE_PRODUCT_PRO=${PADDLE_PRODUCT_PRO:-}
      - PADDLE_PRODUCT_ADVANCED=${PADDLE_PRODUCT_ADVANCED:-}
      - PADDLE_PRICE_STARTER_MONTHLY=${PADDLE_PRICE_STARTER_MONTHLY:?PADDLE_PRICE_STARTER_MONTHLY is required}
      - PADDLE_PRICE_STARTER_YEARLY=${PADDLE_PRICE_STARTER_YEARLY:?PADDLE_PRICE_STARTER_YEARLY is required}
      - PADDLE_PRICE_PRO_MONTHLY=${PADDLE_PRICE_PRO_MONTHLY:?PADDLE_PRICE_PRO_MONTHLY is required}
      - PADDLE_PRICE_PRO_YEARLY=${PADDLE_PRICE_PRO_YEARLY:?PADDLE_PRICE_PRO_YEARLY is required}
      - PADDLE_PRICE_ADVANCED_MONTHLY=${PADDLE_PRICE_ADVANCED_MONTHLY:?PADDLE_PRICE_ADVANCED_MONTHLY is required}
      - PADDLE_PRICE_ADVANCED_YEARLY=${PADDLE_PRICE_ADVANCED_YEARLY:?PADDLE_PRICE_ADVANCED_YEARLY is required}
      - RATE_LIMIT_WINDOW_MS=${RATE_LIMIT_WINDOW_MS:-60000}
      - RATE_LIMIT_MAX=${RATE_LIMIT_MAX:-100}
      - APP_VERSION=${APP_VERSION:-1.0.0}
    volumes:
      - sqlite_data:/app/data
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/ready"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - burflow-net

  nginx:
    build:
      context: .
      dockerfile: Dockerfile
      target: static
    container_name: burflow-nginx
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/production.conf:/etc/nginx/conf.d/default.conf:ro
      # Mount your TLS certificates here (fullchain.pem / privkey.pem):
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      app:
        condition: service_healthy
    networks:
      - burflow-net

volumes:
  sqlite_data:
    name: burflow-sqlite-data

networks:
  burflow-net:
    driver: bridge
