version: "3.8"

services:
  # ─── Production API Gateway ───────────────────────────────────
  reverse-proxy:
    image: nginx:1.25-alpine
    container_name: ce-reverse-proxy
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/api-gateway.conf:/etc/nginx/conf.d/default.conf:ro
      - ssl-certs:/etc/ssl/certs:ro
      - ssl-private:/etc/ssl/private:ro
    depends_on:
      saas-api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - app-network

  # ─── LLM Pipeline Orchestrator ────────────────────────────────
  pipeline-orchestrator:
    build:
      context: .
      dockerfile: Dockerfile
      target: pipeline-runner
    container_name: ce-pipeline
    expose:
      - "${PIPELINE_PORT:-3456}"
    environment:
      - PORT=${PIPELINE_PORT:-3456}
      - NODE_ENV=${NODE_ENV:-production}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - DATA_DIR=/app/data
      - LLM_API_KEY=${LLM_API_KEY:?LLM_API_KEY is required}
      - INTERNAL_SYNC_KEY=${INTERNAL_SYNC_KEY:?INTERNAL_SYNC_KEY is required}
    volumes:
      - app-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${PIPELINE_PORT:-3456}/api/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - app-network

  # ─── SaaS API Server ──────────────────────────────────────────
  saas-api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: ce-saas-api
    expose:
      - "3000"
    ports:
      - "${SAAS_PORT:-3457}:3000"
    environment:
      - PORT=3000
      - NODE_ENV=${NODE_ENV:-production}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - DATABASE_PATH=/app/data/saas.db
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - CORS_ORIGIN=${CORS_ORIGIN:-false}
      - APP_URL=${APP_URL:-https://app.yourdomain.com}
      - WIDGET_SECRET=${WIDGET_SECRET:?WIDGET_SECRET is required}
      - OPENAI_API_KEY=${OPENAI_API_KEY:?OPENAI_API_KEY is required}
      - EMBEDDING_DIMENSION=${EMBEDDING_DIMENSION:-1536}
      - PIPELINE_URL=http://pipeline-orchestrator:${PIPELINE_PORT:-3456}
      - INTERNAL_SYNC_KEY=${INTERNAL_SYNC_KEY:?INTERNAL_SYNC_KEY is required}
      - PADDLE_API_KEY=${PADDLE_API_KEY:-}
      - PADDLE_WEBHOOK_SECRET=${PADDLE_WEBHOOK_SECRET:-}
      - SENDGRID_API_KEY=${SENDGRID_API_KEY:-}
      - RATE_LIMIT_WINDOW_MS=${RATE_LIMIT_WINDOW_MS:-60000}
      - RATE_LIMIT_MAX=${RATE_LIMIT_MAX:-100}
      - EMAIL_PROVIDER=${EMAIL_PROVIDER:-CONSOLE}
      - APP_VERSION=${APP_VERSION:-1.0.0}
    volumes:
      - app-data:/app/data
    depends_on:
      pipeline-orchestrator:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/ready"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - app-network

  # ─── Canonical Dashboard Frontend (frontend/) ──────────────────
  frontend:
    build:
      # The canonical frontend/ lives at the repository root, outside engine/,
      # so the build context is the repo root and the Dockerfile is referenced
      # by its engine/ path.
      context: ..
      dockerfile: engine/Dockerfile.frontend
      args:
        # Build-time variable inlined by Vite. Leave unset for same-origin
        # /api (nginx proxies to saas-api); set to an absolute URL only when
        # the dashboard must call the API on a different origin.
        VITE_API_URL: ${VITE_API_URL:-}
    container_name: ce-frontend
    expose:
      - "80"
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - app-network

volumes:
  app-data:
  ssl-certs:
  ssl-private:

networks:
  app-network:
    driver: bridge
